<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5c400"><title>Hexa Pixel Studio</title>
<style>
:root{--yellow:#ffd51a;--ink:#171717;--panel:#fffdf3;--line:#e6d99c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7bd,#ffd51a 55%,#ffbd08);color:var(--ink);font-family:Inter,system-ui,Segoe UI,sans-serif;min-height:100vh}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.brand{font-weight:900;font-size:clamp(22px,4vw,32px);letter-spacing:-1px}.brand span{background:#171717;color:#ffdc28;padding:4px 9px;border-radius:9px}.sub{font-size:13px;opacity:.7;margin-top:5px}.layout{display:grid;grid-template-columns:minmax(280px,1fr) minmax(280px,.9fr);gap:18px}.panel{background:rgba(255,253,243,.94);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 12px 35px #79550020}.panel h2{font-size:16px;margin:0 0 14px}.canvas-wrap{display:flex;justify-content:center}.grid{width:min(100%,480px);aspect-ratio:1;display:grid;grid-template-columns:repeat(16,1fr);background:white;border:2px solid #222;touch-action:none;user-select:none}.px{border:1px solid #dedede;min-width:0;padding:0}.tools,.actions,.palette{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}.btn{border:1px solid #d7c77d;background:#fff9d9;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer;color:#222}.btn.active,.btn.primary{background:#171717;color:#ffdc28;border-color:#171717}.colorrow{display:flex;align-items:center;gap:10px;margin-top:14px}.swatch{width:27px;height:27px;border-radius:7px;border:1px solid #777;cursor:pointer}.preview{position:relative;display:flex;justify-content:center;align-items:center;min-height:330px;background:repeating-conic-gradient(#eee 0 25%,#fff 0 50%) 50%/22px 22px;border:1px solid #ddd;border-radius:13px;overflow:hidden}.art{width:min(72%,300px);aspect-ratio:1;display:grid;grid-template-columns:repeat(16,1fr);image-rendering:pixelated;border:1px solid #333;background:#fff}.art span{min-width:0}.bubble{position:absolute;left:50%;top:12%;transform:translateX(-50%);max-width:78%;min-width:90px;background:white;border:3px solid #171717;border-radius:18px;padding:10px 14px;text-align:center;font-weight:800;overflow-wrap:anywhere;box-shadow:4px 4px 0 #171717;display:none;z-index:2}.bubble:after{content:"";position:absolute;bottom:-12px;left:24px;width:17px;height:17px;background:white;border-right:3px solid #171717;border-bottom:3px solid #171717;transform:rotate(45deg)}.bubble.show{display:block}.field{width:100%;border:1px solid #d6c77d;border-radius:10px;padding:11px;background:#fff;font:inherit}.hint{font-size:12px;opacity:.65;margin-top:8px}.section{margin-top:16px}.bubblebox{margin-top:12px;padding:12px;background:#fff8d8;border:1px solid #ead783;border-radius:13px}.bubblebox label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.foot{text-align:center;font-size:12px;opacity:.65;padding:20px}@media(max-width:760px){.wrap{padding:14px}.layout{grid-template-columns:1fr}.top{align-items:flex-start}.preview{min-height:280px}}
</style>
</head>
<body><main class="wrap">
<header class="top"><div><div class="brand"><span>HEXA</span> PIXEL STUDIO</div><div class="sub">16×16 pixel art creator · made for creators</div></div><div style="font-size:28px">🟨</div></header>
<div class="layout">
<section class="panel"><h2>🎨 Drawing canvas <small style="opacity:.55">16 × 16</small></h2><div class="canvas-wrap"><div id="grid" class="grid" aria-label="16 by 16 pixel canvas"></div></div>
<div class="tools"><button class="btn active" data-tool="pen">✏️ Pen</button><button class="btn" data-tool="eraser">◻ Eraser</button><button class="btn" data-tool="fill">🪣 Fill</button><button class="btn" data-tool="picker">💉 Picker</button></div>
<div class="colorrow"><input id="color" type="color" value="#242424" style="width:42px;height:38px"><b id="hex">#242424</b><button class="btn" id="gridToggle">Grid: ON</button></div><div class="palette" id="palette"></div>
<div class="actions"><button class="btn" id="undo">↶ Undo</button><button class="btn" id="redo">↷ Redo</button><button class="btn" id="clear">Clear</button></div></section>
<section class="panel"><h2>🖼️ Artwork preview</h2><div class="preview" id="preview"><div class="art" id="art"></div><div class="bubble" id="bubble"></div></div>
<div class="bubblebox"><label>💬 SPEECH BUBBLE / CHAT CLOUD</label><input class="field" id="bubbleText" maxlength="90" placeholder="Type something... e.g. Hello world!"><div class="actions"><button class="btn primary" id="addBubble">＋ Add chat bubble</button><button class="btn" id="removeBubble">Remove bubble</button></div><div class="hint">Your message appears in a comic-style cloud above your pixel art.</div></div>
<div class="actions"><button class="btn primary" id="png">⬇ Download PNG</button><button class="btn" id="save">Save project</button><button class="btn" id="open">Open project</button><input type="file" id="file" accept=".json,application/json" hidden></div><p class="hint" id="status">Ready to create. Draw something!</p></section>
</div><div class="foot">HEXA PIXEL STUDIO · Your art stays in your browser</div></main>
<script>
(()=>{const $=id=>document.getElementById(id),grid=$('grid'),art=$('art'),bubble=$('bubble'),color=$('color'),status=$('status');let px=Array(256).fill('#ffffff'),tool='pen',showGrid=true,down=false,text='',hist=[px.slice()],pos=0;
const palette=['#171717','#ffffff','#777777','#c0c0c0','#ff3434','#ff8b22','#ffe02b','#48b84a','#078348','#22c9ce','#2988ef','#273bd7','#9a50d9','#f06ca7','#9b6038','#f0c99c'];
palette.forEach(c=>{let b=document.createElement('button');b.className='swatch';b.style.background=c;b.title=c;b.onclick=()=>{color.value=c;updateColor()};$('palette').append(b)});
function updateColor(){$('hex').textContent=color.value.toUpperCase()}color.oninput=updateColor;
function draw(){grid.innerHTML='';art.innerHTML='';px.forEach((c,i)=>{let p=document.createElement('button');p.className='px';p.style.background=c;p.style.borderColor=showGrid?'#dedede':'transparent';p.addEventListener('pointerdown',e=>{e.preventDefault();down=true;grid.setPointerCapture(e.pointerId);paint(i)});p.addEventListener('pointerenter',()=>{if(down)paint(i)});grid.append(p);let s=document.createElement('span');s.style.background=c;art.append(s)})}
function saveHist(){hist=hist.slice(0,pos+1);hist.push(px.slice());if(hist.length>80)hist.shift();pos=hist.length-1;status.textContent='Changes saved'}
function paint(i){let c=color.value;if(tool==='picker'){color.value=px[i];updateColor();tool='pen';tools();return}if(tool==='eraser')c='#ffffff';if(tool==='fill'){let old=px[i];px=px.map(x=>x===old?c:x);draw();saveHist();return}if(px[i]===c)return;px[i]=c;grid.children[i].style.background=c;art.children[i].style.background=c}
function tools(){document.querySelectorAll('[data-tool]').forEach(b=>b.classList.toggle('active',b.dataset.tool===tool))}
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;tools()});grid.addEventListener('pointerup',()=>{if(down){down=false;draw();saveHist()}});grid.addEventListener('pointercancel',()=>{if(down){down=false;draw();saveHist()}});
$('undo').onclick=()=>{if(pos>0){px=hist[--pos].slice();draw();status.textContent='Undo'}};$('redo').onclick=()=>{if(pos<hist.length-1){px=hist[++pos].slice();draw();status.textContent='Redo'}};
$('clear').onclick=()=>{px=Array(256).fill('#ffffff');draw();saveHist()};$('gridToggle').onclick=()=>{showGrid=!showGrid;$('gridToggle').textContent='Grid: '+(showGrid?'ON':'OFF');draw()};
$('addBubble').onclick=()=>{text=$('bubbleText').value.trim();if(!text){status.textContent='Type a message first';return}bubble.textContent=text;bubble.classList.add('show');status.textContent='Chat bubble added!'};
$('removeBubble').onclick=()=>{text='';bubble.classList.remove('show');status.textContent='Bubble removed'};
function exportCanvas(){let c=document.createElement('canvas');c.width=512;c.height=512;let x=c.getContext('2d');px.forEach((v,i)=>{x.fillStyle=v;x.fillRect((i%16)*32,Math.floor(i/16)*32,32,32)});if(text){x.font='bold 25px Arial';let lines=[],words=text.split(/\s+/),line='';words.forEach(w=>{let test=line?line+' '+w:w;if(x.measureText(test).width>420&&line){lines.push(line);line=w}else line=test});if(line)lines.push(line);let h=lines.length*32+26,w=Math.min(470,Math.max(...lines.map(l=>x.measureText(l).width))+36),bx=(512-w)/2,by=12;x.fillStyle='#171717';x.beginPath();x.roundRect(bx-3,by-3,w+6,h+6,18);x.fill();x.fillStyle='#fff';x.beginPath();x.roundRect(bx,by,w,h,16);x.fill();x.fillStyle='#171717';x.textAlign='center';lines.forEach((l,i)=>x.fillText(l,256,by+34+i*32))}return c}
$('png').onclick=()=>{let a=document.createElement('a');a.download='hexa-pixel-art.png';a.href=exportCanvas().toDataURL('image/png');a.click();status.textContent='PNG downloaded'};
$('save').onclick=()=>{let a=document.createElement('a'),u=URL.createObjectURL(new Blob([JSON.stringify({width:16,height:16,pixels:px,bubble:text})],{type:'application/json'}));a.href=u;a.download='hexa-pixel-project.json';a.click();URL.revokeObjectURL(u);status.textContent='Project saved'};
$('open').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(d.width!==16||!Array.isArray(d.pixels)||d.pixels.length!==256||!d.pixels.every(c=>/^#[0-9a-f]{6}$/i.test(c)))throw 0;px=d.pixels;text=typeof d.bubble==='string'?d.bubble:'';$('bubbleText').value=text;bubble.textContent=text;bubble.classList.toggle('show',!!text);draw();saveHist();status.textContent='Project loaded'}catch{status.textContent='Invalid project file'}e.target.value=''};
draw();
})();
</script></body></html>
